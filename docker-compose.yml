services:
  namenode:
    build: .
    command: namenode
    ports: ["9000:9000"]
    volumes:
      - nn-meta:/meta

  datanode1:
    build: .
    command: datanode
    environment:
      NAMENODE_ADDR: namenode:9000
      SELF_ADDR: datanode1:9001
      PORT: "9001"
      DATA_DIR: /data
    volumes: ["dn1-data:/data"]
    depends_on: [namenode]

  datanode2:
    build: .
    command: datanode
    environment:
      NAMENODE_ADDR: namenode:9000
      SELF_ADDR: datanode2:9001
      PORT: "9001"
      DATA_DIR: /data
    volumes: ["dn2-data:/data"]
    depends_on: [namenode]

  datanode3:
    build: .
    command: datanode
    environment:
      NAMENODE_ADDR: namenode:9000
      SELF_ADDR: datanode3:9001
      PORT: "9001"
      DATA_DIR: /data
    volumes: ["dn3-data:/data"]
    depends_on: [namenode]
  datanode4:
    build: .
    command: datanode
    environment:
      NAMENODE_ADDR: namenode:9000
      SELF_ADDR: datanode4:9001
      PORT: "9001"
      DATA_DIR: /data
    volumes: ["dn4-data:/data"]
    depends_on: [namenode]

  datanode5:
    build: .
    command: datanode
    environment:
      NAMENODE_ADDR: namenode:9000
      SELF_ADDR: datanode5:9001
      PORT: "9001"
      DATA_DIR: /data
    volumes: ["dn5-data:/data"]
    depends_on: [namenode]
  client:
    build: .
    entrypoint: ["client"]
    environment:
      NAMENODE_ADDR: namenode:9000
    volumes: ["./testdata:/files"]
    profiles: ["tools"]
volumes:
  nn-meta: 
  dn1-data:
  dn2-data:
  dn3-data:
  dn4-data:
  dn5-data: